<!--
  Luno Note mark: a crescent, drawn as one circle minus an offset circle.

  The tile carries its own background (zinc-900, same as `body`) rather than
  sitting transparent, so the mark keeps its contrast on a light browser tab as
  well as a dark one. Monochrome zinc, matching the app.

  One solid path, no mask or filter: favicons get rasterised at 16px, where
  anything finer than this turns to mush.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#18181b"/>
  <path fill="#fafafa" transform="translate(1 -0.8)" d="M13.17 6.93A9.5 9.5 0 1 0 24.33 20.57A9.5 9.5 0 0 1 13.17 6.93Z"/>
</svg>
